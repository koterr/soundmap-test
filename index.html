<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>原宿サウンドマップ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-overlay">
    <button id="start-btn">START</button>
    <p>タップして音声を有効にします</p>
  </div>

  <header id="toolbar">
    <span id="title">原宿サウンドマップ</span>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="stop-all-btn">全停止</button>
    <button id="edit-btn">編集</button>
    <button id="export-btn" hidden>JSON書き出し</button>
  </header>

  <main id="stage">
    <div id="map-wrap">
      <img id="map" src="map.svg" alt="原宿の地図" draggable="false" />
      <div id="pins"></div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
